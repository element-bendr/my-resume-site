name: Stage 03 Command Center Certification

on:
  push:
    branches:
      - feat/portfolio-world-icm-rebuild
    paths:
      - ".github/workflows/stage03-certify.yml"
      - "package.json"
      - "package-lock.json"
      - "src/world/**"
      - "src/app/pages/PlayPage.tsx"
      - "src/styles/global.css"
      - "public/_headers"
      - "tests/movement.test.ts"
      - "tests/world-config.test.ts"
      - "scripts/check-world-*.mjs"
      - "scripts/check-foundation-config.mjs"

permissions:
  contents: read

concurrency:
  group: stage03-command-center
  cancel-in-progress: true

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Node 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 11.20.0
        run: |
          npm install --global npm@11.20.0
          npm --version

      - name: Verify frozen Stage 03 lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts
          cmp --silent /tmp/package-lock.before.json package-lock.json || {
            echo "Committed Stage 03 lockfile is not deterministic for package.json"
            git diff -- package-lock.json
            exit 1
          }

      - name: Clean install
        run: npm ci

      - name: Contract and boundary checks
        run: |
          npm run verify:content
          npm run verify:config
          npm run verify:world

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Production build
        run: npm run build

      - name: Asset budgets
        run: |
          npm run verify:assets
          npm run verify:world-assets

      - name: Preview smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          READY=0
          for attempt in {1..30}; do
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              break
            fi
            if curl --fail --silent http://127.0.0.1:4173/api/health > /tmp/health.json; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/portfolio-preview.log
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
            if (body.ok !== true || body.service !== "vijay-kumaran-portfolio-world") process.exit(1);
          '

          curl --fail --silent http://127.0.0.1:4173/play > /tmp/play.html
          grep -q '<div id="root"></div>' /tmp/play.html

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No headless Chrome/Chromium binary available for visual evidence."
            exit 1
          fi

          mkdir -p .ci-artifacts

          "$CHROME_BIN"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --use-gl=swiftshader             --enable-webgl             --window-size=1440,1000             --virtual-time-budget=5000             --enable-logging=stderr             --dump-dom             http://127.0.0.1:4173/play             > .ci-artifacts/play-dom.html             2> .ci-artifacts/chrome.log || true

          if ! grep -q 'Command Center' .ci-artifacts/play-dom.html; then
            echo "Rendered DOM is missing Command Center UI."
            echo "---- rendered DOM ----"
            cat .ci-artifacts/play-dom.html || true
            echo "---- chrome log ----"
            cat .ci-artifacts/chrome.log || true
            exit 1
          fi

          "$CHROME_BIN"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --use-gl=swiftshader             --enable-webgl             --window-size=1440,1000             --virtual-time-budget=5000             --screenshot=.ci-artifacts/command-center.png             http://127.0.0.1:4173/play             >> .ci-artifacts/chrome.log             2>&1

          test -s .ci-artifacts/command-center.png

      - name: Upload generated Stage 03 lockfile
        if: ${{ always() && hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stage03-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload Command Center browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage03-command-center-browser-evidence
          path: .ci-artifacts/
          if-no-files-found: warn
          retention-days: 3
