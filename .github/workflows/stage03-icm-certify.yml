name: Stage 03 ICM Certification

on:
  push:
    branches:
      - feat/portfolio-world-icm-rebuild
    paths:
      - ".github/workflows/stage03-icm-certify.yml"
      - "workflow/active/portfolio-world-rebuild/state.json"
      - "workflow/active/portfolio-world-rebuild/output/03-command-center-slice-completion-report.md"
      - "docs/portfolio-world/STAGE-03-VALIDATION.md"
      - "HANDOFF.md"

permissions:
  contents: write

concurrency:
  group: stage03-icm-certification
  cancel-in-progress: true

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap ICM check
        run: python3 scripts/bootstrap_check.py

      - name: Workflow check
        run: python3 scripts/workflow_check.py

      - name: Strict workflow status
        run: python3 scripts/workflow_status.py --strict

      - name: Stage 03 certification check
        run: python3 scripts/workflow_certify_check.py --workflow portfolio-world-rebuild --stage 03-command-center-slice

      - name: Certify Stage 03
        run: python3 scripts/workflow_certify.py --workflow portfolio-world-rebuild --stage 03-command-center-slice --write

      - name: Verify post-certification workflow
        run: |
          python3 scripts/workflow_check.py
          python3 scripts/workflow_status.py --strict

      - name: Record certification state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/active/portfolio-world-rebuild/state.json
          git commit -m "chore(icm): certify Stage 03 Command Center [skip ci]"
          git push origin HEAD:feat/portfolio-world-icm-rebuild
