name: ICM Fixture Control Loop

on:
  push:
    branches:
      - icm/control
    paths:
      - ".github/workflows/icm-fixture-control-loop.yml"
      - "workflow/local-execution/queue/blender-loop-fixture-001.json"

permissions:
  contents: write

concurrency:
  group: icm-fixture-control-loop
  cancel-in-progress: false

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blender-world-art-pipeline
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert fixture-only task and exact trusted head
        env:
          TASK_ID: blender-loop-fixture-001
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          task_id = os.environ["TASK_ID"]
          url = f"https://raw.githubusercontent.com/element-bendr/my-resume-site/icm/control/workflow/local-execution/queue/{task_id}.json"
          with urllib.request.urlopen(url, timeout=20) as response:
              task = json.load(response)

          head = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          assert task["task_id"] == "blender-loop-fixture-001"
          assert task["executor_profile"] == "fixture-smoke"
          assert task["validation"] == ["fixture-smoke"]
          assert task["write_paths"] == ["workflow/local-execution/fixtures/**"]
          assert task["base_sha"] == head
          assert task["trusted_ref"] == "refs/heads/feat/blender-world-art-pipeline"
          print(f"FIXTURE_AUTHORITY: PASS base={head}")
          PY

      - name: Detect durable completion
        id: durable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          records = {}
          for kind in ("results", "reviews"):
              path = f"workflow/local-execution/{kind}/blender-loop-fixture-001.json"
              url = f"https://api.github.com/repos/element-bendr/my-resume-site/contents/{path}?ref=icm/control"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      records[kind] = None
                      continue
                  raise
              records[kind] = json.loads(base64.b64decode(payload["content"]).decode("utf-8"))

          complete = (
              records.get("results", {}).get("status") == "pass"
              and records.get("reviews", {}).get("verdict") == "pass"
          )
          output = Path(os.environ.get("GITHUB_OUTPUT", ""))
          if output:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write(f"complete={'true' if complete else 'false'}\n")
          print(f"DURABLE_COMPLETION={complete}")
          PY

      - name: Create machine-local fixture policies
        if: steps.durable.outputs.complete != 'true'
        run: |
          mkdir -p /tmp/icm-policy /tmp/icm-worktrees /tmp/icm-state /tmp/icm-review-worktrees
          cat > /tmp/icm-policy/runner.json <<'JSON'
          {
            "repository": "element-bendr/my-resume-site",
            "trusted_control_refs": ["refs/heads/icm/control"],
            "executor_commands": {
              "fixture-smoke": [
                "python3",
                "tools/icm/fixture_executor.py",
                "--task-file",
                "{task_file}"
              ]
            },
            "validation_commands": {
              "fixture-smoke": [
                "python3",
                "tools/icm/validate_fixture.py",
                "--task-file",
                "{task_file}"
              ]
            },
            "worktree_root": "/tmp/icm-worktrees",
            "state_root": "/tmp/icm-state",
            "command_timeout_seconds": 120,
            "environment_allowlist": [],
            "candidate_remote": "origin"
          }
          JSON
          cat > /tmp/icm-policy/reviewer.json <<'JSON'
          {
            "reviewer_commands": {
              "fixture-review": [
                "python3",
                "tools/icm/fixture_reviewer.py",
                "--context",
                "{review_context}",
                "--output",
                "{review_output}"
              ]
            },
            "review_root": "/tmp/icm-review-worktrees",
            "state_root": "/tmp/icm-state",
            "environment_allowlist": [],
            "command_timeout_seconds": 120
          }
          JSON

      - name: Run hardened control loop
        if: steps.durable.outputs.complete != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/icm/control_loop.py \
            --repo-root "$PWD" \
            --repository element-bendr/my-resume-site \
            --task-id blender-loop-fixture-001 \
            --control-ref refs/heads/icm/control \
            --runner-policy /tmp/icm-policy/runner.json \
            --reviewer-policy /tmp/icm-policy/reviewer.json \
            --executor-identity github-actions/fixture:executor/deterministic \
            --reviewer-profile fixture-review \
            --reviewer-identity github-actions/fixture:reviewer/deterministic \
            --json | tee /tmp/control-loop.json

      - name: Prove durable fixture state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json"
          }

          def record(kind):
              path = f"workflow/local-execution/{kind}/blender-loop-fixture-001.json"
              url = f"https://api.github.com/repos/element-bendr/my-resume-site/contents/{path}?ref=icm/control"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              return json.loads(base64.b64decode(payload["content"]).decode("utf-8"))

          result = record("results")
          review = record("reviews")
          assert result["status"] == "pass"
          assert result["protected_state"] == "unchanged"
          assert result["changed_paths"] == ["workflow/local-execution/fixtures/blender-loop-fixture-001.txt"]
          assert review["verdict"] == "pass"
          assert review["independent"] is True
          assert review["required_fixes"] == []
          assert review["candidate_sha"] == result["candidate_sha"]

          refs = subprocess.check_output([
              "git", "ls-remote", "origin",
              "refs/heads/icm/claims/blender-loop-fixture-001",
              "refs/heads/icm/candidates/blender-loop-fixture-001",
          ], text=True)
          mapping = {}
          for line in refs.splitlines():
              sha, ref = line.split("\t", 1)
              mapping[ref] = sha
          assert mapping["refs/heads/icm/claims/blender-loop-fixture-001"] == result["base_sha"]
          assert mapping["refs/heads/icm/candidates/blender-loop-fixture-001"] == result["candidate_sha"]
          print("DURABLE_FIXTURE_STATE: PASS")
          PY
